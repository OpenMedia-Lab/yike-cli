[package]
name = "yike-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Resumable original-media transfers for your own Baidu Photo library"
license = "MIT"
repository = "https://github.com/OpenMedia-Lab/yike-cli"
readme = "README.md"

[[bin]]
name = "yike"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
directories = "6"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
md-5 = "0.10"
reqwest = { version = "0.13.5", features = ["json", "multipart", "cookies", "stream", "query", "form"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
